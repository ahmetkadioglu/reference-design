name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_install.py -v
  memory-and-project:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r skills/reference-design/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          REFERENCE_DESIGN_BROWSER_TESTS: '1'
      - run: python evals/run_morrow_example.py --output "$RUNNER_TEMP/morrow-evaluation"
